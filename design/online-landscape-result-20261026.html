<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>移动端横屏结算面板</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #272922; }
  body { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .screen { position: relative; width: 100vw; height: 100vh; background: url("online-landscape-result-before-20261026.png") center / 100% 100% no-repeat; }
  .panels { position: absolute; top: 16px; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; height: calc(100% - 32px); }
  .panel { height: 100%; color: #d8d8cc; background: rgba(63, 65, 53, .97); border: 1px solid #77796b; border-radius: 9px; box-shadow: 0 4px 18px #0008, inset 0 1px #ffffff12; }
  .stats { width: 218px; padding: 12px 14px; display: flex; flex-direction: column; }
  .stats h2 { flex: 0 0 32px; margin: 0; color: #f2f2e9; font-size: 18px; line-height: 32px; border-bottom: 1px solid #858779; }
  table { width: 100%; flex: 1; border-collapse: collapse; table-layout: fixed; font-size: 16px; line-height: 20px; }
  td { padding: 0; height: 20px; white-space: nowrap; }
  td:last-child { text-align: right; color: #f0f0e7; font-weight: 700; }
  .ng { color: #a6e22e !important; }
  .result { width: 404px; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .title { flex: 0 0 38px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid #858779; color: #f0f0e7; font-size: 18px; line-height: 25px; white-space: nowrap; }
  .title small { color: #b1b1a4; font-size: 16px; }
  .rate b { color: #df72e8; font-size: 22px; }
  .radar { flex: 1; min-height: 0; display: grid; place-items: center; }
  .radar svg { display: block; width: 250px; height: 218px; overflow: visible; }
  .revive, .actions button { border-radius: 6px; font: inherit; cursor: default; }
  .revive { flex: 0 0 46px; border: 2px solid #f5df47; background: linear-gradient(#756313, #574b15); color: #fff26a; font-size: 19px; font-weight: 700; }
  .actions { flex: 0 0 100px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .actions button { border: 1px solid #66695b; background: linear-gradient(#505246, #414338); color: #dedfd4; font-size: 17px; }
  .note { position: absolute; right: 18px; bottom: 12px; color: #fff9; font-size: 12px; }
  @media (max-aspect-ratio: 2/1) {
    .panels { top: 10px; bottom: 10px; height: calc(100% - 20px); gap: 8px; }
    .stats { width: 194px; padding: 9px 11px; }
    .result { width: 350px; padding: 9px 12px 11px; }
    table { font-size: 14px; line-height: 17px; }
    td { height: 17px; }
    .title { font-size: 16px; }
    .title small { font-size: 14px; }
    .actions button { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="screen">
  <div class="panels">
    <section class="panel stats">
      <h2>数据统计</h2>
      <table><tbody>
        <tr><td>RTime</td><td>6.383 (7)</td></tr>
        <tr><td>Est RTime</td><td>6.963 (7)</td></tr>
        <tr><td>3BV</td><td>11/12</td></tr>
        <tr><td>3BV/s</td><td>1.723</td></tr>
        <tr><td>Ops</td><td>3/3</td></tr>
        <tr><td>Isls</td><td>3/4</td></tr>
        <tr><td>Left</td><td>18@2.820</td></tr>
        <tr><td>Right</td><td>0@0.000</td></tr>
        <tr><td>Double</td><td>0@0.000</td></tr>
        <tr><td>Ce</td><td>18@2.820</td></tr>
        <tr><td>Cl</td><td>18@2.820</td></tr>
        <tr><td>IOE</td><td>0.611</td></tr>
        <tr><td>ThrP</td><td>0.611</td></tr>
        <tr><td>Corr</td><td>1.000</td></tr>
        <tr><td>Path</td><td>29</td></tr>
        <tr><td>Flags</td><td>0</td></tr>
        <tr><td>RQP</td><td>4.621</td></tr>
        <tr><td>QG</td><td>2.124</td></tr>
        <tr><td>STNB</td><td>16.228</td></tr>
        <tr><td>无猜重排</td><td class="ng">1</td></tr>
      </tbody></table>
    </section>
    <section class="panel result">
      <div class="title"><span>未完成 <small>(预计 6.96秒)</small></span><span class="rate">评级：<b>C−</b></span></div>
      <div class="radar">
        <svg viewBox="0 0 250 218" aria-label="五维评级雷达">
          <g transform="translate(125 109)" fill="none" stroke="#777b6d" stroke-width="1">
            <polygon points="0,-76 72,-24 45,62 -45,62 -72,-24"/><polygon points="0,-57 54,-18 34,47 -34,47 -54,-18"/><polygon points="0,-38 36,-12 22,31 -22,31 -36,-12"/><polygon points="0,-19 18,-6 11,15 -11,15 -18,-6"/>
            <path d="M0-76V0M72-24 0 0M45 62 0 0M-45 62 0 0M-72-24 0 0"/>
            <polygon points="0,-42 25,-8 18,25 -45,62 -29,-10" fill="#73d4d044" stroke="#83e4e0" stroke-width="2"/>
            <g fill="#83e4e0" stroke="none"><circle cy="-42" r="3"/><circle cx="25" cy="-8" r="3"/><circle cx="18" cy="25" r="3"/><circle cx="-45" cy="62" r="3"/><circle cx="-29" cy="-10" r="3"/></g>
          </g>
          <g text-anchor="middle" font-family="Arial, PingFang SC, sans-serif">
            <text x="125" y="18" fill="#df72e8" font-size="19" font-weight="700">D</text><text x="125" y="36" fill="#aaa99d" font-size="13">判雷</text>
            <text x="220" y="77" fill="#df72e8" font-size="19" font-weight="700">D</text><text x="220" y="95" fill="#aaa99d" font-size="13">速度</text>
            <text x="190" y="186" fill="#df72e8" font-size="19" font-weight="700">D</text><text x="190" y="204" fill="#aaa99d" font-size="13">效率</text>
            <text x="60" y="186" fill="#f2e86c" font-size="19" font-weight="700">SSS</text><text x="60" y="204" fill="#aaa99d" font-size="13">精准</text>
            <text x="30" y="77" fill="#df72e8" font-size="19" font-weight="700">D−</text><text x="30" y="95" fill="#aaa99d" font-size="13">手速</text>
          </g>
        </svg>
      </div>
      <button class="revive">⚡ 原地复活</button>
      <div class="actions"><button>▣ 再来一局</button><button>↻ 重玩本局</button><button>▶ 查看回放</button><button>⇩ 下载录像</button></div>
    </section>
  </div>
</div>
</body>
</html>
