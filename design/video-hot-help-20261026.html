<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>热门录像规则问号 · 高保真稿</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#141512;color:#b1b1a4;font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh}.wrap{width:320px;padding:28px}.note{color:#75715e;font-size:12px;margin:0 0 12px}.box{background:#272822;border:1px solid #49483e;border-radius:3px;padding:12px 14px 14px;box-shadow:0 2px 10px #0005}h2{font-size:20px;font-weight:400;line-height:30px;margin:0 0 8px;color:#b1b1a4}h2 a{color:inherit;text-decoration:none}.star_help{display:inline-flex;align-items:center;margin-left:6px;color:#b1b1a4;position:relative;cursor:help;vertical-align:middle}.star_help::after{content:attr(data-tip);position:absolute;top:160%;left:50%;transform:translateX(-50%);background:#1e1f1c;color:#f8f8f2;border:1px solid #49483e;border-radius:3px;padding:5px 9px;font-size:12px;line-height:1.7;white-space:normal;width:240px;z-index:2;box-shadow:0 3px 12px #0006}.rows{margin-top:118px;border-top:1px solid #3b3c34}.row{display:grid;grid-template-columns:1fr 42px 62px;gap:6px;padding:7px 0;border-bottom:1px solid #34352f;font-size:13px}.name{color:#b1b1a4}.level,.score{text-align:right}.exp{color:#f92672}.int{color:#a6e22e}.beg{color:#66d9ef}.hint{text-align:center;color:#75715e;font-size:12px;margin:14px 0 0}
</style>
</head>
<body>
  <main class="wrap">
    <p class="note">首页右栏 · hover 状态预览</p>
    <section class="box">
      <h2>
        <a href="#">热门录像</a>
        <span class="star_help" data-tip="选取近30天上传的录像，按“点击量 + 他人有效评论数 × 20”计算热度，取前8部。作者自评、待审及已删除评论不计入。">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="8.4"/><path d="M7.6 8a2.5 2.5 0 1 1 3.4 2.33c-.7.28-1 .77-1 1.47v.3" stroke-linecap="round"/><circle cx="10" cy="14.6" r="0.9" fill="currentColor" stroke="none"/></svg>
        </span>
      </h2>
      <div class="rows">
        <div class="row"><span class="name">钱旭程</span><span class="level exp">高级</span><span class="score exp">38.62</span></div>
        <div class="row"><span class="name">张砷镓</span><span class="level int">中级</span><span class="score int">12.48</span></div>
        <div class="row"><span class="name">王子承尧</span><span class="level beg">初级</span><span class="score beg">3.15</span></div>
      </div>
    </section>
    <p class="hint">问号样式、间距与气泡均同「每日一星」</p>
  </main>
</body>
</html>
