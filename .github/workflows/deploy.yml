name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

concurrency:
  group: deploy-production
  cancel-in-progress: false # 部署排队不并发，避免两次部署互相踩

# 架构（2026-09-27 B1 迁移新机 60.205.137.210 起）：
#   GitHub Actions 构建（ubuntu runner，7G 内存随便跑）→ rsync 构建产物到服务器 →
#   服务器只做 pm2 restart，彻底不在服务器上 next build。
#   背景：旧机（2C3.5G）服务器本地 build 触发 SWC 原生崩溃 + OOM + 内核 hang，
#   一天假死 4 次的事故，详见 .workbuddy/memory/2026-09-27.md。

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 顺序必须是先装 pnpm 再 setup-node：package.json 声明了 packageManager
      # (pnpm@10.32.1)，setup-node@v5 检测到后会在解析缓存时调用 pnpm 可执行文件，
      # 若 pnpm 未装直接报「Unable to locate executable file: pnpm」（2026-09-27 实证）。
      - name: Setup pnpm
        run: npm install -g pnpm@10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # ⚠️ 只能构建一次（标准 .next 目录）：Turbopack build 的清理动作会波及同项目
      # 其他 .next* 目录——本地实测连续两次 NEXT_DIST_DIR=.next-blue/.next-green 构建，
      # 第二次构建把第一次的产物清成空壳（BUILD_ID/manifests 全没了，只剩 types 残留）。
      # 这也是 09-27 服务器上 blue 槽 BUILD_ID 灵异消失 crash loop 的真因。
      # 双槽产物在服务器端由 server-release.sh 用 cp 复制 .next 生成（见 scripts/）。
      - name: Build
        run: pnpm build

      # ⚠️ .next 是点开头的隐藏目录，upload-artifact@v4 默认 include-hidden-files: false
      # 会整个跳过它（2026-09-27 实证：build 成功但 artifact 为空）——必须显式开启
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-builds
          retention-days: 3
          path: .next
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: production # Secrets 配置在 Settings → Environments → production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: next-builds

      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            if [[ -z "${!v}" ]]; then
              echo "::error::缺少 Secret: $v —— 请到 Settings → Secrets and variables → Actions 配置"
              missing=1
            fi
          done
          exit $missing

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync source code (no build on server)
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next*/' \
            --exclude='.workbuddy/' \
            --exclude='.env*' \
            --exclude='.DS_Store' \
            --exclude='videos/' \
            --exclude='public/uploads/' \
            --exclude='.deployed-commit' \
            --filter='protect videos/***' \
            --filter='protect public/uploads/***' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Sync build artifacts
        run: |
          # CI 单次构建的标准 .next 产物同步到服务器 .next-release/
          # （双槽目录由服务器端 server-release.sh 复制生成，不在 CI 构建两次——
          #   Turbopack 二次构建会清掉第一次的产物，见 build job 注释）
          rsync -az --delete \
            --filter='protect cache/***' \
            .next/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/.next-release/

      - name: Restart services on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && bash scripts/server-release.sh && echo -n '${{ github.sha }}' > .deployed-commit"
