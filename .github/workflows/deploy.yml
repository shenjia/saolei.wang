name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

concurrency:
  group: deploy-production
  cancel-in-progress: false # 部署排队不并发，避免两次部署互相踩

# 架构（2026-09-27 B1 迁移新机 60.205.137.210 起）：
#   GitHub Actions 构建（ubuntu runner，7G 内存随便跑）→ rsync 构建产物到服务器 →
#   服务器只做 pm2 restart，彻底不在服务器上 next build。
#   背景：旧机（2C3.5G）服务器本地 build 触发 SWC 原生崩溃 + OOM + 内核 hang，
#   一天假死 4 次的事故，详见 .workbuddy/memory/2026-09-27.md。

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 顺序必须是先装 pnpm 再 setup-node：package.json 声明了 packageManager
      # (pnpm@10.32.1)，setup-node@v5 检测到后会在解析缓存时调用 pnpm 可执行文件，
      # 若 pnpm 未装直接报「Unable to locate executable file: pnpm」（2026-09-27 实证）。
      - name: Setup pnpm
        run: npm install -g pnpm@10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # 双槽都构建：CI 内先构 blue 再构 green，产物分别归档
      # （NEXT_DIST_DIR 经 next.config.ts 的 distDir 生效，同服务器逻辑）
      - name: Build blue slot
        env:
          NEXT_DIST_DIR: .next-blue
        run: pnpm build

      - name: Build green slot
        env:
          NEXT_DIST_DIR: .next-green
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-builds
          retention-days: 3
          path: |
            .next-blue
            .next-green

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: production # Secrets 配置在 Settings → Environments → production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: next-builds

      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            if [[ -z "${!v}" ]]; then
              echo "::error::缺少 Secret: $v —— 请到 Settings → Secrets and variables → Actions 配置"
              missing=1
            fi
          done
          exit $missing

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync source code (no build on server)
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.next*/' \
            --exclude='.workbuddy/' \
            --exclude='.env*' \
            --exclude='.DS_Store' \
            --exclude='videos/' \
            --exclude='public/uploads/' \
            --exclude='.deployed-commit' \
            --filter='protect videos/***' \
            --filter='protect public/uploads/***' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Sync build artifacts
        run: |
          # 双槽构建产物分别同步到服务器对应目录（不在服务器上构建）
          rsync -az --delete \
            --filter='protect cache/***' \
            .next-blue/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/.next-blue/
          rsync -az --delete \
            --filter='protect cache/***' \
            .next-green/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/.next-green/

      - name: Restart services on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && bash scripts/server-release.sh && echo -n '${{ github.sha }}' > .deployed-commit"
