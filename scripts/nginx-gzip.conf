# saolei-gzip.conf — 全站传输压缩（2026-11-10 张老师：ESA 流量费优化）
# 放置：/etc/nginx/conf.d/00-gzip.conf（服务器已装好，root 安装 + systemctl reload nginx）
# ── 背景（分层压缩矩阵实测 2026-11-10）──────────────────────────────────────
#   Next 源站：只压静态文件（css/js），API JSON 从不压缩；
#   nginx：此前全层未配 gzip（public/ 磁盘直读的 css/js/svg 全裸传）；
#   ESA 边缘：未开压缩。
#   实测效果：挑战页 HTML 13.2KB→4.6KB；legacy css 38KB→9.4KB；
#   挑战 API POST 2.4KB→0.96KB。
# ── 说明 ────────────────────────────────────────────────────────────────────
# text/html 不需要列（nginx 默认始终压缩 text/html，列了会告警 duplicate MIME）；
# 已压缩二进制（gif/jpg/png/webp/woff2/zip…）不在 gzip_types，避免 CPU 浪费；
# gzip_min_length 256：小响应（204/图标头）跳过；
# gzip_proxied any：反代上游（Next）响应也压。
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/ttf
    font/otf;
