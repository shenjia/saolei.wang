# saolei-antibot.conf — 反爬三件套（2026-10-21）
# 放置：/etc/nginx/conf.d/00-saolei-antibot.conf（00 前缀确保在站点 conf 之前加载——
#   map/limit_req_zone 必须在 http 块顶层定义，且在使用它们的 server 之前）
# 由 root 执行安装；改动需同步 setup-https-saolei.sh 的 conf 模板（见脚本内「反爬」注释块）
#
# ── 设计（2026-10-21 张老师决策：反爬 + 可信站点走官方 API）──────────────────
# ① UA 黑名单：空 UA / 常见脚本库 UA 直接 403。拦不住会伪装的，但零成本筛掉 90% 低端脚本。
#    白名单：Googlebot/Bingbot/baiduspider/Sogou/YisouSpider（正常收录）+ curl（部署脚本
#    健康检查用 curl 走 nginx --resolve 127.0.0.1，见 server-release.sh L167-168，拦了会误伤回滚判定）
#    ⚠️ curl 放行仅是「不 403」，仍受 limit_req 管辖，普通爬虫换 curl UA 也讨不到便宜
# ② limit_req 三档（key=$binary_remote_addr 客户端 IP；saolei_api 档定义未挂载备用）：
#    全局 10r/s burst 20（真人无感）/ /videos/ 3r/s burst 6（56 万录像文件带宽保护）。
#    2026-10-23：general 档挂载点从 server 顶层下沉到 443 的动态 location /——
#    顶层挂载会把 JS chunk/头像等静态请求也计入 burst，一次页面加载 30-50 请求
#    叠加 Link prefetch 即打满，玩家切排行 tab 出 429；静态 location 自成块即不限速
# ③ nodelay：burst 内的请求立即处理不排队（体验优先），超 burst 才 503
#
# ⚠️ key 用 XFF 的坑：直连场景（无代理）XFF 为空会 fallback 到 $remote_addr，不受影响；
#    伪造 XFF 可绕过——但伪造 XFF 的爬虫已经不是本配置的目标（那是 L2 应用层 rateLimit 的目标）

# UA 黑名单 → 1=拦截 / 0=放行（default 0 放行，只列已知脚本 UA）
# 2026-10-23 补 AI 爬虫档：meta-externalagent（Meta）当天 100 IP 抓 /video 列表
# 2800+ 次，GPTBot/ClaudeBot/CCBot/Bytespider 同类风险，一并拦。
map $http_user_agent $saolei_bad_ua {
    default                 0;
    ""                      1;   # 空 UA：正常浏览器不会发空 UA
    "~*python-requests"     1;
    "~*python-urllib"       1;
    "~*scrapy"              1;
    "~*httpclient"          1;
    "~*okhttp"              1;
    "~*java/"               1;
    "~*go-http-client"      1;
    "~*apache-httpclient"   1;
    "~*node-fetch"          1;
    "~*axios"               1;
    "~*wget"                1;
    "~*libwww-perl"         1;
    "~*mechanize"           1;
    "~*headlesschrome"      1;
    "~*phantomjs"           1;
    "~*puppeteer"           1;
    "~*playwright"          1;
    "~*selenium"            1;
    # --- AI 训练/代理爬虫（不尊重 robots.txt、大量轮换 IP、执行 JS 触发埋点）---
    "~*meta-externalagent"  1;
    "~*gptbot"              1;
    "~*chatgpt-user"        1;
    "~*oai-searchbot"       1;
    "~*claudebot"           1;
    "~*claude-web"          1;
    "~*ccbot"               1;
    "~*bytespider"          1;
    "~*amazonbot"           1;
    "~*google-extended"     1;
}

# 限速 zone（http 顶层）：10MB ≈ 16 万 IP 状态，够用
limit_req_zone $binary_remote_addr zone=saolei_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=saolei_api:10m       rate=5r/s;
limit_req_zone $binary_remote_addr zone=saolei_videos:10m    rate=3r/s;

# 被限速时的响应码（默认 503；用 429 语义更明确）
limit_req_status 429;

# ── 在 saolei.conf 的对应位置需要挂载（本文件只定义，挂载在站点 conf 里）─────────
# server 级（443 块开头）：
#   if ($saolei_bad_ua) { return 403; }
#   limit_req zone=saolei_general burst=20 nodelay;
# /videos/ location 内：
#   limit_req zone=saolei_videos burst=6 nodelay;
# /api/ 需要 Next 路由处理（站点 conf 里没有 /api/ location，走全局 general 档即可；
#   应用层已有 partner/ranking 等 rateLimit 兜底，双保险）

